<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e4">
  <meta name="description" content="山田哉太の詳細プロフィールです。">
  <title>山田哉太の詳細プロフィール</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f1e4;
      --ink: #2c2e2a;
      --muted: #80827f;
      --green: #8ed462;
      --line: #d5d5d4;
      --sandstone: #e0dbce;
      --white: #ffffff;
      --blue: #2ba0ff;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
    }

    .page-shell {
      width: min(900px, calc(100% - 64px));
      margin: 24px auto;
    }

    .site-header,
    .profile-card,
    .site-footer {
      border-radius: 50px;
      background: var(--white);
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      padding: 8px 18px;
    }

    .wordmark {
      color: var(--ink);
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
    }

    .wordmark span {
      color: var(--green);
    }

    .back-link {
      color: var(--ink);
      font-size: 14px;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .profile-card {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 36px;
      margin-top: 32px;
      padding: 32px;
    }

    .profile-visual {
      display: grid;
      min-height: 220px;
      place-items: center;
      border-radius: 50%;
      background: var(--blue);
      color: var(--ink);
      font-size: 64px;
      font-weight: 500;
      letter-spacing: -0.06em;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(36px, 7vw, 64px);
      letter-spacing: -0.06em;
    }

    h1 rt {
      font-size: 0.35em;
      letter-spacing: 0;
    }

    .lead {
      margin: 0 0 20px;
      font-size: 18px;
      line-height: 1.6;
    }

    .profile-details {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 12px 16px;
      margin: 0;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    .profile-details dt,
    .profile-details dd {
      margin: 0;
    }

    .profile-details dt {
      color: var(--muted);
    }

    .profile-details dd {
      font-weight: 600;
    }

    .site-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 32px;
      padding: 24px 32px;
      font-size: 12px;
    }

    .site-footer p {
      margin: 0;
    }

    :focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 4px;
    }

    @media (max-width: 720px) {
      .page-shell {
        width: calc(100% - 32px);
      }

      .profile-card {
        grid-template-columns: 1fr;
        gap: 24px;
        padding: 20px;
      }

      .profile-visual {
        width: 180px;
        min-height: 180px;
        margin: 0 auto;
      }

      .profile-details {
        grid-template-columns: 82px 1fr;
      }

      .site-footer {
        gap: 16px;
        padding: 20px 24px;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="wordmark" href="index.html" aria-label="ポートフォリオのトップへ">our<span>.</span>portfolio</a>
      <a class="back-link" href="index.html#members">自己紹介へ戻る</a>
    </header>

    <main>
      <article class="profile-card" aria-labelledby="profile-name">
        <div class="profile-visual" aria-label="山田哉太のイニシャル">KY</div>
        <div>
          <p class="eyebrow">PROFILE / 山田哉太</p>
          <h1 id="profile-name"><ruby>山田哉太<rt>ヤマダ カナタ</rt></ruby></h1>
          <p class="lead">ツーリングやドライブが好きな山田哉太の詳細ページです。</p>
          <dl class="profile-details">
            <dt>氏名</dt>
            <dd>山田哉太</dd>
            <dt>趣味</dt>
            <dd>ツーリング、ドライブ</dd>
            <dt>好きなこと</dt>
            <dd>車やバイクで出かけること</dd>
            <dt>ひとこと</dt>
            <dd>よろしくお願いします！</dd>
          </dl>
        </div>
      </article>
    </main>

    <footer class="site-footer">
      <p>© 2026 OUR PORTFOLIO</p>
      <a class="back-link" href="index.html">トップへ戻る</a>
    </footer>
  </div>
</body>
</html>
